<style>
:root{
    --bg-main:#f1f5f9;
    --bg-surface:#ffffff;
    --bg-card:#ffffff;
    --bg-ivory:#f8fafc;
    --navy:#0f172a;
    --navy-light:#1e293b;

*{ margin:0; padding:0; box-sizing:border-box; }
html{ scroll-behavior:smooth; scroll-padding-top:88px; }
body{ font-family:"Plus Jakarta Sans",sans-serif; background:var(--bg-main); color:var(--text); font-size:16px; line-height:1.75; overflow-x:hidden; }
img{ max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; }

::-webkit-scrollbar{ width:8px; }
::-webkit-scrollbar-track{ background:#e2e8f0; }
::-webkit-scrollbar-thumb{ background:#94a3b8; border-radius:4px; }

/* NAVIGATION */
.navbar{
    position:fixed; top:0; left:0; width:100%; height:82px; z-index:1000;
    background:rgba(255,255,255,0.96); backdrop-filter:blur(16px);
    border-bottom:1px solid #cbd5e1; box-shadow:0 4px 20px rgba(0,0,0,0.06);
}
.nav-inner{ max-width:var(--max-width); height:100%; margin:auto; padding:0 32px; display:flex; align-items:center; justify-content:space-between; gap:28px; }

/* SOPHISTICATED CUSTOM PAR GEOMETRIC MONOGRAM */
.logo{ display:flex; align-items:center; gap:14px; text-decoration:none; }
.par-monogram-svg {
    width: 56px;
    height: 56px;
    display: block;
}
.logo-text-group {
    display: flex;
    flex-direction: column;
}
.logo-name {
    font-family: "Space Grotesk", sans-serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #0f172a;
    line-height: 1.1;
}
.logo-title {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #475569;
    text-transform: uppercase;
    margin-top: 2px;
}

.nav-links{ display:flex; align-items:center; gap:24px; }
.nav-links a{ position:relative; color:#334155; font-size:13.5px; font-weight:600; letter-spacing:0.3px; transition:0.3s ease; }
.nav-links a:hover, .nav-links a.active{ color:#0f172a; }
.nav-links a::after{ content:""; position:absolute; left:0; bottom:-6px; width:0; height:2px; background:#0f172a; transition:0.3s ease; }
.nav-links a:hover::after, .nav-links a.active::after{ width:100%; }
.nav-actions{ display:flex; gap:12px; }
.nav-btn{ padding:9px 18px; border:1px solid #0f172a; border-radius:2px; color:#0f172a; background:rgba(15,23,42,0.04); font-size:13px; font-weight:700; letter-spacing:0.5px; transition:0.3s ease; }
.nav-btn:hover{ background:#0f172a; color:#ffffff; }
.menu-btn{ display:none; border:1px solid #cbd5e1; background:transparent; color:#0f172a; padding:8px 12px; border-radius:2px; }

/* SECTION RYTHM & SPACING */
section{ position:relative; padding:112px 0; background:#f8fafc; border-bottom:1px solid #e2e8f0; }
section:nth-of-type(even){ background:#ffffff; }
.profile{background:#f8fafc!important;}
.competencies{background:#f1f5f9!important;}
.digital{background:#ffffff!important;}
.ai-qs{background:#f8fafc!important;}
.experience-section{background:#f1f5f9!important;}
.projects-section{background:#ffffff!important;}
.container{ width:min(var(--max-width), calc(100% - 72px)); margin:auto; }
.eyebrow{ display:flex; align-items:center; gap:14px; margin-bottom:14px; color:#334155; font-size:12.5px; font-weight:800; letter-spacing:2px; text-transform:uppercase; font-family:"Space Grotesk",sans-serif; }
.eyebrow::before{ content:""; width:32px; height:2px; background:#0f172a; }
.section-title{ font-family:"Space Grotesk",sans-serif; color:#0f172a; font-size:43px; line-height:1.15; letter-spacing:-0.5px; margin-bottom:16px; font-weight:700; }
.section-description{ max-width:900px; color:#475569; font-size:17px; line-height:1.8; margin-bottom:50px; font-weight:500; }

/* HERO SECTION WITH DYNAMIC ROTATING BACKGROUND */
.hero{
    min-height:860px; display:flex; align-items:center; padding-top:140px; padding-bottom:90px; overflow:hidden; position:relative; background:#ffffff; border-bottom:1px solid #cbd5e1;
}
.hero-bg-slider {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
}
.hero-slide {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    opacity: 0; transition: opacity 1.8s ease-in-out;
    animation: kenBurns 15s infinite alternate ease-in-out;
}
.hero-slide.active { opacity: 0.08; }

@keyframes kenBurns {
    0% { transform: scale(1); }
    100% { transform: scale(1.06); }
}

.hero-overlay {
    position: absolute; inset: 0; z-index: 1; background: linear-gradient(115deg, rgba(255,255,255,0.97) 0%, rgba(248,250,252,0.94) 52%, rgba(241,245,49,0.90) 100%);
}

.hero-grid{ position:relative; z-index:2; display:grid; grid-template-columns:minmax(0,1.35fr) minmax(380px,.75fr); gap:50px; align-items:center; }
.hero-content{ max-width:840px; }
.hero-title{ 
    font-family:"Space Grotesk",sans-serif; font-size:clamp(42px, 4.2vw, 62px); line-height:1.1; letter-spacing:-1px; color:#0f172a; margin-bottom:22px; font-weight:700;
}
.hero-title span{ 
    display:block; color:#334155; font-size:clamp(18px, 1.9vw, 24px); line-height:1.35; letter-spacing:0.5px; margin-top:16px; font-weight:600; text-transform: uppercase;
}
.hero-description{ max-width:750px; color:#475569; font-size:17px; line-height:1.8; margin-bottom:32px; font-weight:400; }
.hero-buttons{ display:flex; gap:14px; flex-wrap:wrap; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:50px; padding:0 26px; border-radius:2px; font-size:14px; font-weight:700; letter-spacing:0.5px; transition:0.3s ease; cursor:pointer; }
.btn-primary{ background:#0f172a; color:#ffffff; border:1px solid #0f172a; box-shadow:0 4px 16px rgba(15,23,42,0.15); }
.btn-primary:hover{ background:#334155; border-color:#334155; transform:translateY(-1px); }
.btn-outline{ background:rgba(15,23,42,0.03); color:#0f172a; border:1px solid #cbd5e1; font-weight:600; }
.btn-outline:hover{ background:rgba(15,23,42,0.08); border-color:#0f172a; transform:translateY(-1px); }

/* POSITIONING CARD */
.position-card{
    padding:36px; background:#ffffff; border:1px solid #cbd5e1; border-radius:4px;
    box-shadow:0 24px 48px rgba(15,23,42,0.08); backdrop-filter:blur(12px);
}
.profile-photo{ width:100%; max-width:240px; height:320px; object-fit:cover; border-radius:2px; margin:0 auto 20px auto; box-shadow:0 8px 24px rgba(15,23,42,0.08); border:1px solid #cbd5e1; }
.card-label{ color:#334155; font-size:11.5px; font-weight:800; letter-spacing:2px; text-transform:uppercase; margin-bottom:18px; text-align:center; font-family:"Space Grotesk",sans-serif; }
.position-list{ list-style:none; text-align:left; }
.position-list li{ display:flex; align-items:flex-start; gap:12px; color:#334155; font-size:13.5px; line-height:1.6; margin-bottom:12px; font-weight:500; }
.position-list i{ color:#0f172a; margin-top:3px; }

/* STATS */
.stats{ background:#f1f5f9; border-top:1px solid #cbd5e1; border-bottom:1px solid #cbd5e1; padding:40px 0; }
.stats-grid{ display:grid; grid-template-columns:repeat(4,1fr); }
.stat{ padding:4px 28px; border-right:1px solid #cbd5e1; }
.stat:last-child{ border-right:none; }
.stat-number{ color:#0f172a; font-family:"Space Grotesk",sans-serif; font-size:36px; font-weight:700; line-height:1.2; margin-bottom:4px; letter-spacing:-0.5px; }
.stat-number span { color: #334155; }
.stat-label{ color:#1e293b; font-size:15px; font-weight:700; }
.stat-note{ color:#475569; font-size:13px; margin-top:2px; font-weight:400; }

/* PROFILE STATEMENT */
.statement{ margin-top:30px; padding:28px 32px; border-left:3px solid #0f172a; background:#f8fafc; color:#0f172a; font-size:17px; line-height:1.8; font-weight:500; border-radius:0 4px 4px 0; border-top:1px solid #cbd5e1; border-right:1px solid #cbd5e1; border-bottom:1px solid #cbd5e1; }

/* COMMERCIAL COMPETENCIES (TIER-1 EPC GRID) */
.competency-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
.competency-card{ padding:32px; background:#ffffff; border:1px solid #cbd5e1; border-radius:4px; box-shadow:0 4px 16px rgba(15,23,42,0.03); transition:0.3s ease; position:relative; overflow:hidden; }
.competency-card::before{ content:""; position:absolute; top:0; left:0; width:100%; height:2px; background:transparent; transition:0.3s ease; }
.competency-card:hover{ border-color:#94a3b8; box-shadow:0 12px 32px rgba(15,23,42,0.08); transform:translateY(-2px); }
.competency-card:hover::before{ background:#0f172a; }
.competency-icon{ width:48px; height:48px; display:flex; align-items:center; justify-content:center; color:#0f172a; background:#f1f5f9; border:1px solid #cbd5e1; border-radius:2px; margin-bottom:20px; font-size:18px; }
.competency-card h3{ color:#0f172a; font-family:"Space Grotesk",sans-serif; font-size:18.5px; margin-bottom:10px; font-weight:700; }
.competency-card p{ color:#475569; font-size:14.5px; line-height:1.75; font-weight:400; }

/* DIGITAL QS IDENTITY REDESIGN */
.digital-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
.digital-card{ padding:32px; background:#ffffff; border:1px solid #cbd5e1; border-radius:4px; box-shadow:0 4px 16px rgba(15,23,42,0.03); transition:0.3s ease; }
.digital-card:hover{ border-color:#94a3b8; box-shadow:0 12px 32px rgba(15,23,42,0.08); }
.digital-card h3{ display:flex; align-items:center; gap:12px; color:#0f172a; font-family:"Space Grotesk",sans-serif; font-size:18.5px; margin-bottom:12px; font-weight:700; }
.digital-card h3 i{ color:#0f172a; font-size:18px; }
.digital-card p{ color:#475569; font-size:14.5px; line-height:1.75; margin-bottom:20px; font-weight:400; }
.tech-badges{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.tech-badge{ display:flex; align-items:center; gap:8px; padding:6px 12px; background:#f8fafc; border:1px solid #cbd5e1; border-radius:2px; font-size:12px; font-weight:700; color:#0f172a; }
.tech-badge i{ color:#0f172a; }

/* AI × QS IDENTITY REDESIGN (ENTERPRISE ANALYTICAL FRAMEWORK) */
.ai-qs-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:24px; }
.ai-qs-card{ padding:34px; background:#ffffff; border:1px solid #cbd5e1; border-radius:4px; box-shadow:0 4px 16px rgba(15,23,42,0.03); transition:0.3s ease; }
.ai-qs-card:hover{ border-color:#94a3b8; box-shadow:0 12px 32px rgba(15,23,42,0.08); }
.ai-qs-card h3{ display:flex; align-items:center; gap:14px; color:#0f172a; font-family:"Space Grotesk",sans-serif; font-size:19px; margin-bottom:14px; font-weight:700; }
.ai-qs-card h3 i{ color:#0f172a; font-size:20px; }
.ai-qs-card p{ color:#475569; font-size:15px; line-height:1.8; font-weight:400; }

/* CAREER GROWTH & MRICS SECTION */
.career-growth-box {
    background: #ffffff; border: 1px solid #cbd5e1; border-radius: 4px; padding: 44px; box-shadow: 0 4px 24px rgba(15,23,42,0.04); margin-top: 45px;
}
.career-growth-grid { display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 40px; align-items: center; }
.career-growth-content h3 { font-family: "Space Grotesk", sans-serif; color: #0f172a; font-size: 24px; font-weight: 700; margin-bottom: 14px; }
.career-growth-content p { color: #475569; font-size: 15.5px; line-height: 1.8; font-weight: 400; margin-bottom: 18px; }
.roadmap-steps { display: flex; flex-direction: column; gap: 14px; }
.roadmap-step { display: flex; align-items: flex-start; gap: 14px; padding: 18px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 2px; }
.roadmap-step i { color: #0f172a; font-size: 18px; margin-top: 3px; }
.roadmap-step h4 { color: #0f172a; font-size: 14.5px; font-weight: 700; margin-bottom: 2px; font-family: "Space Grotesk", sans-serif; }
.roadmap-step p { color: #475569; font-size: 13.5px; margin: 0; line-height: 1.6; }

/* EXPERIENCE TIMELINE */
.timeline{ position:relative; max-width:1050px; margin:auto; padding-left:40px; }
.timeline::before{ content:""; position:absolute; top:0; left:7px; width:2px; height:100%; background:#cbd5e1; }
.timeline-item{ position:relative; padding-bottom:50px; }
.timeline-item::before{ content:""; position:absolute; left:-40px; top:4px; width:14px; height:14px; border-radius:50%; background:#ffffff; border:2px solid #0f172a; box-shadow:0 0 0 4px rgba(15,23,42,0.08); }
.timeline-date{ color:#334155; font-size:12.5px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:8px; font-family:"Space Grotesk",sans-serif; }
.timeline h3{ color:#0f172a; font-family:"Space Grotesk",sans-serif; font-size:22px; margin-bottom:4px; font-weight:700; }
.timeline-company{ color:#0f172a; font-size:16px; font-weight:700; margin-bottom:6px; }
.timeline-project{ color:#334155; font-size:14.5px; font-weight:700; margin-bottom:16px; }
.timeline ul{ padding-left:20px; list-style-type:disc; }
.timeline li{ color:#475569; font-size:15.5px; line-height:1.8; margin-bottom:12px; font-weight:400; }
.timeline li strong { color: #0f172a; font-weight: 700; }

/* PROJECTS */
.projects-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
.project-card{ overflow:hidden; background:#ffffff; border:1px solid #cbd5e1; border-radius:4px; box-shadow:0 4px 16px rgba(15,23,42,0.03); transition:0.3s ease; }
.project-card:hover{ border-color:#94a3b8; box-shadow:0 12px 32px rgba(15,23,42,0.08); }
.project-image{ width:100%; height:220px; object-fit:cover; transition:0.4s ease; }
.project-card:hover .project-image{ transform:scale(1.03); }
.project-content{ padding:26px; }
.project-number{ color:#334155; font-size:11.5px; font-weight:800; letter-spacing:2px; margin-bottom:8px; font-family:"Space Grotesk",sans-serif; }
.project-content h3{ color:#0f172a; font-family:"Space Grotesk",sans-serif; font-size:19.5px; line-height:1.3; margin-bottom:6px; font-weight:700; }
.project-location{ color:#334155; font-size:13px; font-weight:700; text-transform:uppercase; margin-bottom:12px; letter-spacing:0.5px; }
.project-content p{ color:#475569; font-size:14.5px; line-height:1.75; font-weight:400; }

/* CONTACT */
.contact-card{ padding:40px; max-width:1050px; background:#ffffff; border:1px solid #cbd5e1; border-radius:4px; box-shadow:0 12px 36px rgba(15,23,42,0.06); }
.contact-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:24px; padding-bottom:28px; border-bottom:1px solid #e2e8f0; }
.contact-name{ color:#0f172a; font-family:"Space Grotesk",sans-serif; font-size:26px; font-weight:700; margin-bottom:4px; }
.contact-role{ color:#334155; font-size:14.5px; font-weight:700; letter-spacing:0.5px; }
.contact-location{ color:#475569; font-size:14px; margin-top:12px; font-weight:500; }
.contact-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px 30px; padding:28px 0; }
.contact-item{ display:flex; align-items:center; gap:12px; color:#0f172a; font-size:14.5px; font-weight:600; }
.contact-item i{ width:18px; color:#334155; }
.contact-buttons{ display:flex; gap:12px; padding-top:24px; border-top:1px solid #e2e8f0; }

/* FOOTER */
footer{ padding:32px 0; background:#ffffff; border-top:1px solid #cbd5e1; text-align:center; }
footer p{ color:#475569; font-size:13.5px; font-weight:400; }
footer strong{ color:#0f172a; }

/* SCROLL REVEAL */
.reveal{ opacity:0; transform:translateY(20px); transition:opacity 0.6s ease, transform 0.6s ease; }
.reveal.show{ opacity:1; transform:translateY(0); }


/* === SENIOR QS PORTFOLIO V3 POLISH === */
:root{ --ink:#0f172a; --gold:#334155; --gold-bright:#0f172a; --paper:#f8fafc; --surface:#ffffff; }
.section-title{ max-width:1050px; letter-spacing:-1.1px; }
.section-description{ max-width:900px; font-size:16px; line-height:1.85; }
.profile .section-title{ max-width:980px; }
.profile .section-title{ font-size:clamp(34px,4vw,54px); line-height:1.12; }

/* Larger, more distinctive technology identity */
.digital-grid{grid-template-columns:repeat(3,1fr);gap:22px;}
.digital-card{padding:30px 28px 26px;border-radius:8px;min-height:260px;position:relative;overflow:hidden;}
.digital-card::after{content:"";position:absolute;right:-35px;bottom:-55px;width:150px;height:150px;border-radius:50%;border:1px solid rgba(15,23,42,.14);}
.tech-brand{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
.tech-logo{width:58px;height:58px;flex:0 0 58px;display:grid;place-items:center;border-radius:12px;font-family:"Space Grotesk",sans-serif;font-weight:800;font-size:18px;letter-spacing:-.5px;box-shadow:0 8px 20px rgba(15,23,42,.10);}
.tech-logo.autocad{background:#334155;color:#fff;}
.tech-logo.bluebeam{background:#475569;color:#fff;}
.tech-logo.navis{background:#1e293b;color:#fff;}
.tech-logo.excel{background:#0f172a;color:#fff;}
.tech-logo.oracle{background:#64748b;color:#fff;font-size:13px;}
.tech-logo.wrench{background:#1e293b;color:#fff;}
.tech-logo.qs{background:#0f172a;color:#fff;font-size:13px;}
.tech-brand h3{margin:0;font-size:18px;line-height:1.25;}
.digital-card p{font-size:14.5px;line-height:1.75;margin-bottom:0;}
.digital-tag{display:inline-flex;margin-top:18px;padding:6px 10px;border:1px solid #cbd5e1;background:#f8fafc;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#0f172a;border-radius:4px;}

/* AI section: analytical, credible, not developer-heavy */
.ai-qs{background:#f1f5f9;}
.ai-qs-intro{display:grid;grid-template-columns:110px 1fr;gap:26px;align-items:center;margin:28px 0 34px;padding:24px 26px;border:1px solid #cbd5e1;background:#fff;border-radius:8px;}
.ai-mark{width:92px;height:92px;border-radius:18px;background:#0f172a;display:grid;place-items:center;color:#ffffff;font-family:"Space Grotesk",sans-serif;font-size:21px;font-weight:800;letter-spacing:-1px;box-shadow:0 12px 28px rgba(15,23,42,.16);position:relative;overflow:hidden;}
.ai-mark::before,.ai-mark::after{content:"";position:absolute;border:1px solid rgba(255,255,255,.35);border-radius:50%;}
.ai-mark::before{width:64px;height:64px}.ai-mark::after{width:38px;height:38px;}
.ai-qs-card{padding:30px;border-radius:8px;min-height:190px;}
.ai-qs-card h3{font-size:18px;line-height:1.35;}
.ai-qs-card p{font-size:14.5px;line-height:1.75;}

/* Replace CV-like bullet lists with commercial responsibility modules */
.timeline{max-width:1120px;padding-left:0;}
.timeline::before{display:none;}
.timeline-item{padding:34px 36px 36px;margin-bottom:24px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 8px 28px rgba(15,23,42,.045);}
.timeline-item::before{display:none;}
.timeline-date{display:inline-flex;padding:7px 11px;background:#e2e8f0;border:1px solid #cbd5e1;border-radius:4px;margin-bottom:14px;}
.timeline h3{font-size:25px;letter-spacing:-.4px;}
.timeline-company{font-size:16px;}
.timeline-project{font-size:14px;margin-bottom:24px;}
.role-intro{max-width:850px;color:#475569;font-size:15px;line-height:1.75;margin-bottom:24px;}
.responsibility-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px;}
.responsibility{position:relative;padding:17px 18px 16px 56px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:6px;min-height:105px;}
.responsibility-index{position:absolute;left:17px;top:17px;font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:800;color:#334155;letter-spacing:1px;}
.responsibility h4{font-family:"Space Grotesk",sans-serif;color:#0f172a;font-size:14px;margin:0 0 6px;font-weight:800;}

/* === FINAL V4: PREMIUM SENIOR QS VISUAL SYSTEM === */
:root{
